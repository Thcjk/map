name: Preise prüfen

# Läuft jede Stunde kurz nach :17. Ob wirklich geprüft wird, bestimmt data/settings.json
# («intervalHours»: 6 = alle 6 Stunden, 1 = stündlich, z. B. rund um Black Friday).
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Sofort prüfen (Takt ignorieren)'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: check-prices
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Preise abfragen
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          FORCE: ${{ inputs.force || 'false' }}
        run: node scraper/run.js
      - name: Ergebnis speichern
        run: |
          if git diff --quiet -- data; then
            echo "Keine Änderungen."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "Preise aktualisiert"
          git pull --rebase
          git push
