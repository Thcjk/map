name: Supabase wach halten

# Supabase pausiert Gratis-Projekte nach 7 Tagen ohne Aktivität.
# Diese Action ruft alle 3 Tage eine harmlose Funktion auf (liest keine Daten).
# Hinweis: Geplante Actions laufen nur auf dem Standard-Branch des Repos.
on:
  schedule:
    - cron: '17 5 */3 * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Projekt anpingen
        env:
          URL: ${{ secrets.VITE_SUPABASE_URL }}
          KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "Supabase-Secrets fehlen – nichts zu tun."
            exit 0
          fi
          curl --fail --silent --show-error -X POST "$URL/rest/v1/rpc/keepalive" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" -d '{}'
